name: Make Sync Text
on:
  push:
    paths: ['players.csv']
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -c '
          import csv
          nicks = [r["nickname"].strip() for r in csv.DictReader(open("players.csv", encoding="utf-8")) if r.get("nickname")]
          with open("SYNC.txt", "w", encoding="utf-8") as f:
              f.write("/run for _,n in ipairs({" + ",".join(f"\"{n}\"" for n in nicks) + "}) do AddIgnore(n) end")
          '
      - run: |
          git config user.name "Bot"
          git config user.email "bot@github.com"
          git add SYNC.txt
          git diff --staged --quiet || git commit -m "Sync update"
          git push
