name: Make Sync Text
on:
  push:
    paths:
      - 'add_ignore.csv'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - run: |
          python3 -c '
          import csv
          with open("add_ignore.csv", encoding="utf-8") as f:
              rows = list(csv.reader(f))
          nicks = [r[0].strip() for r in rows[1:] if r and r[0].strip()]
          with open("SYNC.txt", "w", encoding="utf-8") as out:
              out.write("/run for _,n in ipairs({" + ",".join(f"\"{n}\"" for n in nicks) + "}) do AddIgnore(n) end")
          '
      - run: |
          git config user.name "Bot"
          git config user.email "bot@github.com"
          git add SYNC.txt
          git diff --staged --quiet || git commit -m "Sync update"
          git push
