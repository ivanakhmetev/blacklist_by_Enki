name: Make Sync Text
on:
  push:
    paths:
      - 'add_ignore.csv'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - run: |
          python3 -c '
          import csv
          with open("add_ignore.csv", encoding="utf-8") as f:
              rows = list(csv.reader(f))
          
          horde, alliance = [], []
          for r in rows[1:]:
              if not r or not r[0].strip(): continue
              nick = r[0].strip()
              row_text = ",".join(r).lower()
              if "horde" in row_text or "орда" in row_text:
                  if nick not in horde: horde.append(nick)
              elif "alliance" in row_text or "альянс" in row_text:
                  if nick not in alliance: alliance.append(nick)

          with open("SYNC_HORDE.txt", "w", encoding="utf-8") as f:
              f.write("/run for _,n in ipairs({" + ",".join(f"\"{n}\"" for n in horde[-50:]) + "}) do AddIgnore(n) end")
          with open("SYNC_ALLIANCE.txt", "w", encoding="utf-8") as f:
              f.write("/run for _,n in ipairs({" + ",".join(f"\"{n}\"" for n in alliance[-50:]) + "}) do AddIgnore(n) end")
          '
      - run: |
          git config user.name "Bot"
          git config user.email "bot@github.com"
          git add SYNC_HORDE.txt SYNC_ALLIANCE.txt
          git diff --staged --quiet || git commit -m "Sync update"
          git push
